<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="תוכנית הממליצים של טירונות סוכנים עברה לגלריה - כאן מיד הקישור.">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="3;url=https://gallery.aimprove.co.il/referrals">
  <title>תוכנית הממליצים · טירונות סוכנים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #14093B;
      --gold: #FFD747;
      --green: #05905D;
      --green-light: #E7F4EF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--green-light);
      font-family: 'Rubik', Arial, sans-serif;
      direction: rtl;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #FFFFFF;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(20, 9, 59, .1);
      padding: 40px 32px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: var(--navy);
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .5px;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 18px;
    }
    h1 {
      color: var(--navy);
      font-size: 22px;
      font-weight: 800;
      line-height: 1.4;
      margin: 0 0 12px;
    }
    p {
      color: #4A4458;
      font-size: 15.5px;
      line-height: 1.7;
      margin: 0 0 26px;
    }
    a.cta {
      display: inline-block;
      background: var(--green);
      color: #FFFFFF;
      padding: 14px 32px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }
    .note {
      margin-top: 18px;
      font-size: 13px;
      color: #9B93AC;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">תוכנית הממליצים</span>
    <h1>עברנו מקום 💚</h1>
    <p>תוכנית הממליצים עברה לגלריה של הבוגרים. מעבירים אתכם עוד רגע, או שאפשר ללחוץ עכשיו.</p>
    <a class="cta" href="https://gallery.aimprove.co.il/referrals">להצטרפות לתוכנית</a>
    <div class="note">אם המעבר לא קרה - הקישור למעלה תמיד עובד.</div>
  </div>

<script>
/* ── הסכמה לכלי-שיווק (פיקסל פייסבוק + גוגל אנליטיקס) — נוסף 24-08-2026 ──
   שונה לגמרי ממדידת-המשפך למעלה: זו לא מדידה אנונימית פנימית - זה מעביר
   מידע לפייסבוק וגוגל, שאיתם אפשר לבנות קהלי-רימרקטינג ולמדוד קמפיינים
   בתשלום. בלי אישור מפורש - שני הסקריפטים לא נטענים בכלל, לא ברקע ולא
   בשום צורה.

   ההסכמה נשמרת ב-localStorage (aim_consent: 'granted'/'denied') ותקפה
   לדף הזה בלבד - אתר סטטי נפרד מהוורדפרס של aimprove.co.il, ואין ביניהם
   שום שיתוף-מצב. כפתור "פרטיות" הקבוע בפינה מאפשר לשנות החלטה בכל רגע. */
(function () {
  try {
    var CONSENT_KEY = 'aim_consent';
    var PIXEL_ID = '1249254740429699';
    var GA_ID = 'G-4VXR3V1J4N';
    var PAGE = 'referral'; /* השורה היחידה שמשתנה בהעתקה לדף אחר - ר' EV_PAGES ב-Worker */

    function loadPixel() {
      try {
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
        document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', PIXEL_ID);
        fbq('track', 'PageView');
      } catch (e) {}
    }

    function loadGA() {
      try {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', GA_ID);
      } catch (e) {}
    }

    function loaded() {
      try { return !!(window.fbq && window.fbq.loaded); } catch (e) { return false; }
    }

    function loadAll() {
      if (loaded()) return;
      loadPixel();
      loadGA();
    }

    /* רישום ההחלטה בשרת (Worker + Airtable) - אותו צינור בדיוק כמו מדידת-
       המשפך (בדפים שבהם היא רצה), כדי שתהיה רשומה מרכזית של מי הסכים
       ומתי, לא רק דגל בדפדפן של המבקר עצמו. אותו מפתח sessionStorage
       (aim_vid) כמו המשפך - אם הוא כבר קיים נעשה בו שימוש חוזר (כדי
       שאפשר יהיה לצלוב אם ירצו), ואם לא, נוצר כאן מזהה אפמרלי חדש כדי
       שהבלוק הזה יעבוד גם בדף שאין בו את סקריפט המשפך. */
    function sendConsentEvent(choice) {
      try {
        var vid = '';
        try { vid = sessionStorage.getItem('aim_vid') || ''; } catch (e) {}
        if (!vid) {
          vid = (Math.random().toString(16).slice(2) + Math.random().toString(16).slice(2)).slice(0, 16);
          try { sessionStorage.setItem('aim_vid', vid); } catch (e) {}
        }
        var payload = JSON.stringify({ v: 1, vid: vid, e: 'consent', p: PAGE, c: choice });
        var ENDPOINT = 'https://r.aimprove.co.il/e';
        if (navigator.sendBeacon) {
          navigator.sendBeacon(ENDPOINT, new Blob([payload], { type: 'text/plain;charset=UTF-8' }));
        } else {
          var x = new XMLHttpRequest();
          x.open('POST', ENDPOINT, true);
          x.setRequestHeader('Content-Type', 'text/plain;charset=UTF-8');
          x.send(payload);
        }
      } catch (e) {}
    }

    var bar = null;

    /* בונים ב-JS ולא ב-HTML קבוע, כדי שלא יהיה שום הבזק (flash) של הבאנר
       למי שכבר החליט בעבר. */
    function showBanner() {
      if (bar) return;
      bar = document.createElement('div');
      bar.setAttribute('dir', 'rtl');
      bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;'
        + 'background:#14093B;color:#fff;padding:16px 20px;'
        + 'display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;'
        + 'font-family:"Rubik",Arial,sans-serif;font-size:14.5px;line-height:1.5;'
        + 'box-shadow:0 -6px 24px rgba(0,0,0,.25);';

      var text = document.createElement('span');
      text.style.cssText = 'flex:1;min-width:240px;max-width:640px;';
      text.textContent = 'אנחנו משתמשים בעוגיות שיווקיות (פייסבוק, גוגל) כדי להבין מה עובד ולהראות לכם תוכן רלוונטי. אפשר לאשר או לסרב - הדף יעבוד בכל מקרה.';

      var btnRow = document.createElement('div');
      btnRow.style.cssText = 'display:flex;gap:10px;flex-shrink:0;';

      var accept = document.createElement('button');
      accept.type = 'button';
      accept.textContent = 'מאשר/ת';
      accept.style.cssText = 'background:#FFD747;color:#14093B;border:none;border-radius:10px;'
        + 'padding:10px 22px;font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit;';

      var decline = document.createElement('button');
      decline.type = 'button';
      decline.textContent = 'לא תודה';
      decline.style.cssText = 'background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);'
        + 'border-radius:10px;padding:10px 22px;font-weight:600;font-size:14.5px;cursor:pointer;font-family:inherit;';

      function close() {
        try { bar.remove(); } catch (e) {}
        bar = null;
      }

      accept.addEventListener('click', function () {
        try { localStorage.setItem(CONSENT_KEY, 'granted'); } catch (e) {}
        sendConsentEvent('granted');
        loadAll();
        close();
      });
      decline.addEventListener('click', function () {
        try { localStorage.setItem(CONSENT_KEY, 'denied'); } catch (e) {}
        sendConsentEvent('denied');
        close();
      });

      btnRow.appendChild(accept);
      btnRow.appendChild(decline);
      bar.appendChild(text);
      bar.appendChild(btnRow);
      document.body.appendChild(bar);
    }

    /* כפתור-פינה קבוע וצנוע - מאפשר לשנות החלטה גם אחרי שכבר נבחרה. */
    function addReopener() {
      var link = document.createElement('button');
      link.type = 'button';
      link.textContent = '⚙ פרטיות';
      link.setAttribute('dir', 'rtl');
      link.style.cssText = 'position:fixed;left:14px;bottom:14px;z-index:9998;'
        + 'background:rgba(20,9,59,.85);color:#fff;border:none;border-radius:20px;'
        + 'padding:7px 14px;font-size:12.5px;font-family:"Rubik",Arial,sans-serif;'
        + 'cursor:pointer;opacity:.55;transition:opacity .15s;';
      link.addEventListener('mouseenter', function () { link.style.opacity = '1'; });
      link.addEventListener('mouseleave', function () { link.style.opacity = '.55'; });
      link.addEventListener('click', showBanner);
      function mount() { document.body.appendChild(link); }
      if (document.body) mount();
      else document.addEventListener('DOMContentLoaded', mount);
    }

    var consent = '';
    try { consent = localStorage.getItem(CONSENT_KEY) || ''; } catch (e) {}

    if (consent === 'granted') loadAll();
    else if (consent !== 'denied') {
      if (document.body) showBanner();
      else document.addEventListener('DOMContentLoaded', showBanner);
    }

    addReopener();
  } catch (e) { /* לעולם לא שובר את הדף */ }
})();
</script>

</body>
</html>
