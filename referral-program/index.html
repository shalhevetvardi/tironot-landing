<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="תוכנית הממליצים של טירונות סוכנים עברה לגלריה - כאן מיד הקישור.">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="3;url=https://gallery.aimprove.co.il/referrals">
  <title>תוכנית הממליצים · טירונות סוכנים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #14093B;
      --gold: #FFD747;
      --green: #05905D;
      --green-light: #E7F4EF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--green-light);
      font-family: 'Rubik', Arial, sans-serif;
      direction: rtl;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #FFFFFF;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(20, 9, 59, .1);
      padding: 40px 32px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: var(--navy);
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .5px;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 18px;
    }
    h1 {
      color: var(--navy);
      font-size: 22px;
      font-weight: 800;
      line-height: 1.4;
      margin: 0 0 12px;
    }
    p {
      color: #4A4458;
      font-size: 15.5px;
      line-height: 1.7;
      margin: 0 0 26px;
    }
    a.cta {
      display: inline-block;
      background: var(--green);
      color: #FFFFFF;
      padding: 14px 32px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }
    .note {
      margin-top: 18px;
      font-size: 13px;
      color: #9B93AC;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">תוכנית הממליצים</span>
    <h1>עברנו מקום 💚</h1>
    <p>תוכנית הממליצים עברה לגלריה של הבוגרים. מעבירים אתכם עוד רגע, או שאפשר ללחוץ עכשיו.</p>
    <a class="cta" href="https://gallery.aimprove.co.il/referrals">להצטרפות לתוכנית</a>
    <div class="note">אם המעבר לא קרה - הקישור למעלה תמיד עובד.</div>
  </div>
</body>
</html>
